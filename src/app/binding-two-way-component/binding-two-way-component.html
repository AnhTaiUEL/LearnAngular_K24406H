<h2>Giải Phương Trình Bậc 2 (ax² + bx + c = 0)</h2>
<table border="1">
  <tr>
    <td>Hệ số a:</td>
    <td><input type="number" [(ngModel)]="a" placeholder="Nhập a" /></td>
  </tr>
  <tr>
    <td>Hệ số b:</td>
    <td><input type="number" [(ngModel)]="b" placeholder="Nhập b" /></td>
  </tr>
  <tr>
    <td>Hệ số c:</td>
    <td><input type="number" [(ngModel)]="c" placeholder="Nhập c" /></td>
  </tr>
  <tr>
    <td>Kết quả:</td>
    <td [innerHTML]="result"></td>
  </tr>
  <tr>
    <td colspan="2" align="center">
      <button (click)="giai()">Giải</button>
      |
      <button (click)="ptMoi()">PT mới</button>
    </td>
  </tr>
</table>
