<h2>Product List (Call ProductService)</h2>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products; trackBy: trackByProductId">
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td><img [src]="p.image" alt="{{ p.name }}" width="60" /></td>
    </tr>
  </tbody>
</table>
