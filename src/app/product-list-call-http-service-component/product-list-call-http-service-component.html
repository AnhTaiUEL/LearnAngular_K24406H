<h2> Product List (Call ProductHttpService with Signal)</h2>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
        <td><img [src]="p.image" alt="{{ p.name }}" width="60" /></td>
      </tr>
    }
  </tbody>
</table>
