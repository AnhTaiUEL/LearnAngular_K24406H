<h2> Product List (Handle Error HTTP Service)</h2>

@if (errorMessage) {
  <div style="color: red; padding: 10px; border: 1px solid red; background-color: #ffe6e6; margin-top: 10px; max-width: 500px;">
    <strong>⚠️ Thông báo lỗi:</strong> {{ errorMessage }}
  </div>
}

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products; trackBy: trackByProductId">
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td><img [src]="p.image" alt="{{ p.name }}" width="60" /></td>
    </tr>
  </tbody>
</table>
